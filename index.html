<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drive Ultra</title>

<style>
body{background:#0d1117;color:#fff;font-family:sans-serif;margin:0}
.container{padding:10px}
.file{display:flex;gap:10px;padding:10px;border-bottom:1px solid #30363d}
.thumb{width:50px;height:50px;background:#222;border-radius:8px}
button{background:#238636;border:none;color:#fff;padding:8px;border-radius:6px}
input{width:100%;padding:10px;margin:5px 0;background:#0d1117;color:#fff;border:1px solid #30363d}
.nav{position:fixed;bottom:0;width:100%;display:flex;background:#161b22}
.nav button{flex:1;background:none}
progress{width:100%;height:6px}
.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#161b22;padding:10px;border-radius:6px;opacity:0;transition:.3s}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:#000;display:none;justify-content:center;align-items:center}
.modal img,.modal video{max-width:90%}
</style>
</head>

<body>

<div class="container">
<h3>Drive Ultra</h3>

<input id="token" placeholder="GitHub Token">
<input id="repo" placeholder="username/repo">
<input id="path" placeholder="uploads">

<div id="home"></div>

<div id="upload" style="display:none">
<input type="file" id="file" multiple>
<button onclick="startUpload()">Upload</button>

<progress id="totalBar" value="0" max="100"></progress>
<div id="queue"></div>
</div>

</div>

<div class="nav">
<button onclick="page('home')">🏠</button>
<button onclick="page('upload')">⬆️</button>
</div>

<div id="toast" class="toast"></div>
<div id="modal" class="modal" onclick="this.style.display='none'"></div>

<script>
function t(){return token.value}
function r(){return repo.value}
function p(){return path.value||"uploads"}

function toast(msg){
 let el=toastEl
 el.innerText=msg
 el.classList.add("show")
 setTimeout(()=>el.classList.remove("show"),2000)
}

let toastEl=document.getElementById("toast")

function page(x){
 home.style.display=x==="home"?"block":"none"
 upload.style.display=x==="upload"?"block":"none"
 if(x==="home")load()
}

/* TIME */
function time(ts){
 let d=(Date.now()-ts)/1000
 if(d<5)return"just now"
 if(d<60)return~~d+"s"
 if(d<3600)return~~(d/60)+"m"
 if(d<86400)return~~(d/3600)+"h"
 if(d<604800)return~~(d/86400)+"d"
 return~~(d/604800)+"w"
}

/* PREVIEW */
function view(url){
 if(url.match(/\.(jpg|png|jpeg|gif)$/)){
  modal.innerHTML=`<img src="${url}">`
 }else if(url.match(/\.(mp4|webm)$/)){
  modal.innerHTML=`<video src="${url}" controls autoplay></video>`
 }else return window.open(url)
 modal.style.display="flex"
}

/* FILE UI */
function ui(f){
 let ts=Number(f.name.split("_")[0])
 return `
 <div class="file">
  <div class="thumb"></div>
  <div style="flex:1">
   ${f.name}<br><small>${time(ts)}</small>
  </div>
  <div>
   <button onclick="view('${f.download_url}')">👁</button>
   <button onclick="copy('${f.download_url}')">📋</button>
   <button onclick="del('${f.path}','${f.sha}')">🗑</button>
  </div>
 </div>`
}

/* LOAD */
async function load(){
 let res=await fetch(`https://api.github.com/repos/${r()}/contents/${p()}`)
 let data=await res.json()

 data.sort((a,b)=>Number(b.name.split("_")[0])-Number(a.name.split("_")[0]))

 home.innerHTML=""
 data.forEach(f=>home.innerHTML+=ui(f))
}

/* QUEUE SYSTEM */
let queue=[]
let uploading=false

function startUpload(){
 let files=file.files
 for(let f of files){
  queue.push(f)
 }
 processQueue()
}

async function processQueue(){
 if(uploading)return
 uploading=true

 let total=queue.length
 let done=0

 while(queue.length){
  let f=queue.shift()
  await uploadOne(f)
  done++
  totalBar.value=(done/total)*100
 }

 uploading=false
 load()
}

/* UPLOAD */
function uploadOne(file){
 return new Promise(res=>{
  let name=Date.now()+"_"+file.name

  // instant UI
  home.innerHTML=ui({name:name,download_url:"#",path:"#",sha:"#"})+home.innerHTML

  let reader=new FileReader()
  reader.onload=()=>{
   let base64=reader.result.split(',')[1]

   let xhr=new XMLHttpRequest()
   xhr.open("PUT",`https://api.github.com/repos/${r()}/contents/${p()}/${name}`)
   xhr.setRequestHeader("Authorization","token "+t())
   xhr.setRequestHeader("Content-Type","application/json")

   let bar=document.createElement("progress")
   bar.max=100
   queueDiv.appendChild(bar)

   xhr.upload.onprogress=e=>{
    if(e.lengthComputable){
     bar.value=(e.loaded/e.total)*100
    }
   }

   xhr.onload=()=>{
    toast(xhr.status===201?"Upload success":"Upload failed")
    res()
   }

   xhr.onerror=()=>{
    toast("Upload failed")
    res()
   }

   xhr.send(JSON.stringify({
    message:"upload",
    content:base64
   }))
  }
  reader.readAsDataURL(file)
 })
}

let queueDiv=document.getElementById("queue")

/* DELETE */
async function del(pth,sha){
 await fetch(`https://api.github.com/repos/${r()}/contents/${pth}`,{
  method:"DELETE",
  headers:{
   Authorization:"token "+t(),
   "Content-Type":"application/json"
  },
  body:JSON.stringify({message:"delete",sha:sha})
 })
 load()
}

/* COPY */
function copy(t){
 navigator.clipboard.writeText(t)
 toast("Copied")
}

page("home")
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drive Ultra</title>

<style>
body{background:#0d1117;color:#fff;font-family:sans-serif;margin:0}
.container{padding:10px}
.file{display:flex;gap:10px;padding:10px;border-bottom:1px solid #30363d;align-items:center}
.thumb{width:50px;height:50px;border-radius:8px;object-fit:cover;background:#222}
button{background:#238636;border:none;color:#fff;padding:6px;border-radius:6px}
input{width:100%;padding:10px;margin:5px 0;background:#0d1117;color:#fff;border:1px solid #30363d}

/* ✅ NAV FIXED CENTER */
.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
  background:#161b22;
  padding:10px;
  border-top:1px solid #30363d;
}

/* ✅ BUTTON PUSH EFFECT */
.nav button{
  flex:none;
  padding:10px 16px;
  border-radius:10px;
  transition:transform 0.12s ease, background 0.12s ease;
}
.nav button:active{
  transform:scale(0.9);
  background:#2ea043;
}

progress{width:100%;height:6px}
.progress-box{flex:1}
.percent{font-size:12px;color:#aaa}
.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#161b22;padding:10px;border-radius:6px;opacity:0;transition:.3s}
.toast.show{opacity:1}
</style>
</head>

<body>

<div class="container">
<h3>Drive Ultra</h3>

<input id="token" placeholder="GitHub Token">
<input id="repo" placeholder="username/repo">
<input id="path" placeholder="uploads">

<input id="search" placeholder="Search files..." oninput="load()">

<div id="home"></div>

<div id="upload" style="display:none">
<input type="file" id="file" multiple>
<button onclick="startUpload()">Upload</button>

<h4>📂 Uploaded (last 1 day)</h4>
<div id="recentUploads"></div>

<progress id="totalBar" value="0" max="100"></progress>
<div id="queue"></div>
</div>

</div>

<div class="nav">
<button onclick="page('home')">🏠</button>
<button onclick="page('upload')">⬆️</button>
</div>

<div id="toast" class="toast"></div>

<script>
function t(){return token.value}
function r(){return repo.value}
function p(){return path.value||"uploads"}

function toast(msg){
 toastEl.innerText=msg
 toastEl.classList.add("show")
 setTimeout(()=>toastEl.classList.remove("show"),2000)
}
let toastEl=document.getElementById("toast")

function page(x){
 home.style.display=x==="home"?"block":"none"
 upload.style.display=x==="upload"?"block":"none"
 if(x==="home")load()
 if(x==="upload")loadUploads()
}

function time(ts){
 let d=(Date.now()-ts)/1000
 if(d<5)return"just now"
 if(d<60)return~~d+"s"
 if(d<3600)return~~(d/60)+"m"
 if(d<86400)return~~(d/3600)+"h"
 if(d<604800)return~~(d/86400)+"d"
 return~~(d/604800)+"w"
}

function ui(f){
 let ts=Number(f.name.split("_")[0])
 let thumb=""

 if(f.download_url && f.name.match(/\.(jpg|png|jpeg|gif)$/)){
  thumb=`<img class="thumb" src="${f.download_url}">`
 } else {
  thumb=`<div class="thumb"></div>`
 }

 return `
 <div class="file">
  ${thumb}
  <div style="flex:1">
   ${f.name}<br><small>${time(ts)}</small>
  </div>
  <div>
   <button onclick="copy('${f.download_url}')">📋</button>
   <button onclick="del('${f.path}','${f.sha}')">🗑</button>
  </div>
 </div>`
}

async function load(){
 let res=await fetch(`https://api.github.com/repos/${r()}/contents/${p()}`)
 let data=await res.json()

 let q=search.value.toLowerCase()

 data.sort((a,b)=>Number(b.name.split("_")[0])-Number(a.name.split("_")[0]))

 home.innerHTML=""
 data.forEach(f=>{
  if(!f.name.toLowerCase().includes(q)) return
  home.innerHTML+=ui(f)
 })
}

async function loadUploads(){
 let res=await fetch(`https://api.github.com/repos/${r()}/contents/${p()}`)
 let data=await res.json()

 let now=Date.now()
 recentUploads.innerHTML=""

 data.forEach(f=>{
  let ts=Number(f.name.split("_")[0])
  if(isNaN(ts)) return
  if((now-ts)/1000 <= 86400){
    recentUploads.innerHTML+=ui(f)
  }
 })
}

let uploading=false
let filesQueue=[]

function startUpload(){
 filesQueue=[...file.files]
 processQueue()
}

async function processQueue(){
 if(uploading)return
 uploading=true

 let total=filesQueue.length
 let done=0

 queue.innerHTML=""

 while(filesQueue.length){
  let f=filesQueue.shift()
  await uploadOne(f, done)
  done++
  totalBar.value=(done/total)*100
 }

 uploading=false
 load()
 loadUploads()
}

function uploadOne(file,index){
 return new Promise(res=>{
  let name=Date.now()+"_"+file.name

  home.innerHTML=ui({
   name:name,
   download_url:"",
   path:"",
   sha:""
  })+home.innerHTML

  let box=document.createElement("div")
  box.className="file"
  box.innerHTML=`
    <div style="flex:1">${file.name}</div>
    <div class="progress-box">
      <progress value="0" max="100" id="prog${index}"></progress>
      <div class="percent" id="txt${index}">0%</div>
    </div>
  `
  queue.appendChild(box)

  let reader=new FileReader()
  reader.onload=()=>{
   let base64=reader.result.split(',')[1]

   let xhr=new XMLHttpRequest()
   xhr.open("PUT",`https://api.github.com/repos/${r()}/contents/${p()}/${name}`)
   xhr.setRequestHeader("Authorization","token "+t())
   xhr.setRequestHeader("Content-Type","application/json")

   xhr.upload.onprogress=e=>{
    if(e.lengthComputable){
     let percent=Math.round((e.loaded/e.total)*100)
     document.getElementById("prog"+index).value=percent
     document.getElementById("txt"+index).innerText=percent+"%"
    }
   }

   xhr.onload=()=>{
    toast(xhr.status===201?"Upload success":"Upload failed")
    res()
   }

   xhr.onerror=()=>{
    toast("Upload failed")
    res()
   }

   xhr.send(JSON.stringify({
    message:"upload",
    content:base64
   }))
  }
  reader.readAsDataURL(file)
 })
}

async function del(pathFile,sha){
 if(!pathFile||!sha){
  toast("Wait upload finish")
  return
 }

 await fetch(`https://api.github.com/repos/${r()}/contents/${pathFile}`,{
  method:"DELETE",
  headers:{
   Authorization:"token "+t(),
   "Content-Type":"application/json"
  },
  body:JSON.stringify({message:"delete",sha:sha})
 })

 toast("Deleted")
 load()
 loadUploads()
}

function copy(t){
 navigator.clipboard.writeText(t)
 toast("Copied")
}

page("home")
</script>

</body>
</html>
